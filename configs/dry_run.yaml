# Dry-run config: 20+20+10 instances, end-to-end pipeline validation
# Run this before the full experiment to catch bugs cheaply (~$5 cloud spend)

experiment:
  name: "dry_run_v1"
  description: "Pipeline validation on small subset"
  random_seed: 42

huggingface:
  token: "hf_..."
  cache_dir: "data/hf_cache"

corpus:
  output_dir: "data/corpus_dry"
  contradiction:
    sources: ["snli"]
    target_size: 20
    min_annotator_agreement: 4
    type_balance: null   # skip type balance for dry run
  baseline:
    sources: ["snli"]
    target_size: 20
    labels: ["neutral"]  # primary control = neutral per analysis_protocol.md Section 7
    matching:
      length_tolerance: 0.15
      vocab_overlap_min: 0.3
      syntax_complexity_tolerance: 0.2
  synthetic:
    target_size: 10
    types: ["single_negation"]
  attention_graph_subset:
    contradiction: 10
    baseline: 10
    synthetic: 5

inference:
  output_dir: "data/embeddings_dry"
  models:
    - name: "meta-llama/Llama-3.1-8B"
      role: "base"
      quantization: "4bit"
      revision: "d04e592bb4f6aa9cfee91e2e20afa771667e1d4b"   # SHA pin, Section 10
    # Skip Instruct for dry run
  batch_size: 4
  representations:
    extract_per_token_embeddings: true
    extract_attention: true
    attention_layer_range: [22, 32]
    per_token_layer: 24   # confirmatory per-token arm, analysis_protocol Section 10

topology:
  output_dir: "results/topology_dry"
  sentence_embedding_arm:
    library: "ripser"
    max_dim: 4
    subsample_size: 100   # smaller for dry run
    n_bootstrap: 5
    sparse_filtration_threshold: 500
  attention_graph_arm:
    library: "dionysus"
    max_dim: 4
    edge_weight_thresholds: 10
    n_bootstrap: 3

analysis:
  output_dir: "results/analysis_dry"
  figure_dir: "results/figures_dry"
  bootstrap:
    n_iterations: 100   # smaller for dry run
    confidence_level: 0.95
  significance:
    require_disjoint_ci: true
    min_separation_ratio: 2.0
  type_stratification: false
  cross_arm_integration: true
